name: La Vedetta del Galoppo

on:
  schedule:
    # Esegue il bot tutti i giorni alle 07:00 UTC (circa le 08:00/09:00 in Italia)
    - cron: '0 7 * * *'
  # Permette di avviare il bot manualmente con il pulsante "Run workflow"
  workflow_dispatch: 

jobs:
  lancia-vedetta:
    runs-on: ubuntu-latest

    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests groq feedparser

      - name: Lancia la Vedetta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python vedetta.py
