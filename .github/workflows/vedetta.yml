name: Vedetta Bot - Eco del Galoppo

on:
  workflow_dispatch:
    # Lasciamo solo questo: permette a cron-job.org di triggerare 
    # lo script da remoto tramite chiamata API HTTP.
  repository_dispatch:
    types: [trigger-vedetta]
    # Aggiunto per sicurezza, se cron-job.org usa un webhook personalizzato.

permissions:
  contents: write

jobs:
  esegui-vedetta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout della repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser groq

      - name: Esegui vedetta.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: python vedetta.py

      - name: Salva lo stato aggiornato nel repo
        run: |
          git config user.name "vedetta-bot"
          git config user.email "actions@github.com"
          git add vedetta_state.json
          git diff --staged --quiet || git commit -m "Aggiorna stato vedetta [skip ci]"
          git push
