name: La Vedetta del Galoppo

on:
  schedule:
    # 05:14 UTC (7:14 italiane) -> Becca anche il Briefing e le gare asiatiche/mattutine
    - cron: '14 5 * * *'
    # 12:14 UTC (14:14 italiane) -> Controllo pomeridiano per le gare europee/UK
    - cron: '14 12 * * *'
  workflow_dispatch: 

jobs:
  esplorazione:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa le dipendenze
      run: |
        pip install requests google-genai undetected-chromedriver

    - name: Lancia la Vedetta
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python vedetta.py
